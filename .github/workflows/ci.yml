name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18  # same major as the EC2 (Ubuntu 24.04 nodejs)
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
        working-directory: gateway
      - run: npm test
        working-directory: gateway
      - name: python and relay checks
        run: |
          python3 monitor/test_verify.py
          for t in scripts/test_*.py infra/*/test_*.py; do python3 "$t"; done
          node monitor/test_push_receiver.mjs
          bash scripts/e2e-relay.sh
          bash infra/deploy/test_remote.sh
          bash infra/deploy/test_ssm_run.sh
          bash infra/deploy/test_ci_run_to_deploy.sh
          bash infra/new-account/test_backup.sh
          bash infra/new-account/test_rebuild.sh
          bash infra/backup/test_backup_restore.sh
      - name: cloudformation templates
        run: |
          pip install --quiet cfn-lint
          cfn-lint --regions sa-east-1 -- infra/deploy/stack.yml infra/cloudwatch/stack.yml infra/cloudwatch/host-alarms.yml infra/https/stack.yml
      # Same Caddy as the host (Ubuntu 24.04 package). The package starts it on :80; the test
      # uses its own ports, so stop the service and run the binary.
      - name: caddy origin checks
        run: |
          sudo apt-get install -y -q caddy >/dev/null
          sudo systemctl stop caddy
          bash infra/https/test_caddy.sh
      # The manifests let the host prove, file by file, that what landed is what was built.
      - name: gateway and tools tarballs
        run: |
          mkdir -p dist
          tar -czf dist/gateway.tar.gz -C gateway src public package.json package-lock.json
          (cd gateway && find src public package.json package-lock.json -type f | sort | xargs sha256sum) > dist/gateway.manifest
          tools="scripts/lab.py scripts/sensor-health.py scripts/aea-geofix.py infra/cloudwatch/aea-cw-probe.py infra/deploy/remote.sh"
          tar -czf dist/tools.tar.gz $tools
          sha256sum $tools > dist/tools.manifest
          (cd dist && sha256sum gateway.tar.gz tools.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ github.sha }}
          path: dist/

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The receptors trust only the key in this secret; a build signed with another key fails
      # install -r. Signed explicitly (Gradle's injected signing): on the runner AGP did not
      # use ~/.android/debug.keystore and made its own key (CI run 2).
      # PRs from forks get no secrets: they still test, but upload no APK.
      - name: signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receptor.keystore"
            {
              echo "signed=true"
              echo "gradle_signing=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/receptor.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android"
            } >> "$GITHUB_OUTPUT"
          fi
      - run: ./gradlew --no-daemon :android-listener:testDebugUnitTest :android-listener:assembleDebug ${{ steps.key.outputs.gradle_signing }}
      - name: apk and checksum
        if: steps.key.outputs.signed == 'true'
        run: |
          mkdir -p dist
          cp android-listener/build/outputs/apk/debug/android-listener-debug.apk dist/listener.apk
          # Wrong key = signature mismatch on install -r at deploy time. Fail here instead.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          # The full output goes to the log: an empty or reworded answer must be visible.
          # Labels seen: "Signer #1 certificate SHA-256 digest:" (build-tools 35) and
          # "V2 Signer: certificate SHA-256 digest:" (runner, CI run 2).
          signer_output="$("$apksigner" verify --print-certs dist/listener.apk 2>&1)" || { echo "$signer_output"; echo "::error::apksigner verify failed"; exit 1; }
          echo "$signer_output"
          digests="$(sed -nE 's/^(V[0-9.]+ )?Signer[^:]*:? ?certificate SHA-256 digest: ([0-9a-f]{64})$/\2/p' <<<"$signer_output" | sort -u)"
          # Every signer block must be the receptor key, and there must be at least one.
          test "$digests" = "${{ vars.LISTENER_CERT_SHA256 }}" || { echo "::error::APK signer(s) [${digests//$'\n'/ }] not exactly the receptor key"; exit 1; }
          (cd dist && sha256sum listener.apk > listener.apk.sha256)
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: listener-apk-${{ github.sha }}
          path: dist/

  ios-core:
    # RelayCore declares .macOS(.v26): the tests run on the host, so the runner must be macOS 26.
    runs-on: macos-26
    # A hung contract test (server.js up, never answering) must not hold the deploy gate for 6 h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      # GatewayContractTests start the real gateway/src/server.js (APNS_DRY_RUN=1).
      - run: npm ci
        working-directory: gateway
      - name: swift test
        working-directory: ios-client/RelayCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          # A contract suite that was filtered out or skipped must fail the job, not pass it quietly.
          log=$(cat "$RUNNER_TEMP/swift-test.log")
          ran=$(grep -A1 "Test Suite 'GatewayContractTests' passed" <<<"$log" | grep -E "Executed [1-9][0-9]* tests?, with 0 failures" || true)
          [[ -n $ran ]] || { echo "GatewayContractTests did not run" >&2; exit 1; }
          [[ $log != *" skipped and "* ]] || { echo "tests were skipped" >&2; exit 1; }
