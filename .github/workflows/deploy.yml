name: deploy

# Gateway and host tools, after a green CI on main, once someone approves `production`.
# The APK is not here: see deploy-apk.yml.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # Hotfix path, only with the user's approval: deploys a main push whose CI is green except
  # ios-core (e.g. GitHub macOS runners down). Still needs the `production` approval.
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "ci run id (main push; every job but ios-core green)"
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  gateway-and-tools:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      # The resolver only, from the ref this workflow runs on; the deployed commit is checked out next.
      - uses: actions/checkout@v4
        with:
          path: resolver
          sparse-checkout: infra/deploy/ci-run-to-deploy.sh
          sparse-checkout-cone-mode: false
      - name: ci run to deploy
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_RUN_ID: ${{ inputs.ci_run_id }}
        run: bash resolver/infra/deploy/ci-run-to-deploy.sh
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: gateway-${{ steps.ci.outputs.sha }}
          path: dist
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
      # Only the subject claim, never the token: when the role trust does not match, the log
      # shows exactly what GitHub sent (the first run failed on the immutable subject format).
      - name: oidc subject
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq -r '"sub=\(.sub) aud=\(.aud) ref=\(.ref)"'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      # Gateway first: it rolls itself back if it cannot prove coverage.
      - run: |
          bash infra/deploy/ssm-run.sh "${{ vars.RECEPTOR_INSTANCE_ID }}" "${{ vars.DEPLOY_BUCKET }}" \
            "${{ steps.ci.outputs.sha }}" dist \
            "gateway BUNDLE ${{ steps.ci.outputs.sha }}" "tools BUNDLE"
