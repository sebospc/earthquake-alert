name: deploy

# Gateway and host tools, after a green CI on main, once someone approves `production`.
# The APK is not here: see deploy-apk.yml.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  gateway-and-tools:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: gateway-${{ github.event.workflow_run.head_sha }}
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Only the subject claim, never the token: when the role trust does not match, the log
      # shows exactly what GitHub sent (the first run failed on the immutable subject format).
      - name: oidc subject
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq -r '"sub=\(.sub) aud=\(.aud) ref=\(.ref)"'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      # Gateway first: it rolls itself back if it cannot prove coverage.
      - run: |
          bash infra/deploy/ssm-run.sh "${{ vars.RECEPTOR_INSTANCE_ID }}" "${{ vars.DEPLOY_BUCKET }}" \
            "${{ github.event.workflow_run.head_sha }}" dist \
            "gateway BUNDLE ${{ github.event.workflow_run.head_sha }}" "tools BUNDLE"
