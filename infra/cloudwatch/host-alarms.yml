# The three alarms for one receptor host, fed by aea-cw-probe.py with Host=<instance id>.
# One stack per host, so a dead host cannot hide behind a healthy one. Needs stack.yml first.
#   aws cloudformation deploy --region sa-east-1 --stack-name aea-lab-alarms-<instance id> \
#     --template-file infra/cloudwatch/host-alarms.yml \
#     --parameter-overrides Host=<instance id> JournalHostname=<hostname, printed by install.sh> \
#     --tags project=aea-lab
# Retiring a host: delete its stack, or its alarms page forever on missing data.
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Host:
    Type: String
    AllowedPattern: "i-[0-9a-f]+"
  # The journal lines carry the hostname, not the instance id; install.sh prints it.
  JournalHostname:
    Type: String
    AllowedPattern: "[a-z0-9.-]+"
Resources:
  # Every alarm: missing data = the host, the agent or the probe is gone. That pages.
  GatewayDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aea-lab-${Host}-gateway-down
      AlarmDescription: !Sub Gateway /status unreachable for 3 min on ${Host}, or the host or its probe is down.
      Namespace: AeaLab
      MetricName: GatewayUp
      Dimensions: [{ Name: Host, Value: !Ref Host }]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue aea-lab-alert-topic]
      OKActions: [!ImportValue aea-lab-alert-topic]

  ReceptorUncoveredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aea-lab-${Host}-receptor-uncovered
      AlarmDescription: !Sub A receptor on ${Host} has not been covered in /status for 10 min. Check /status for which.
      Namespace: AeaLab
      MetricName: UncoveredReceptors
      Dimensions: [{ Name: Host, Value: !Ref Host }]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue aea-lab-alert-topic]
      OKActions: [!ImportValue aea-lab-alert-topic]

  # The swapfile is an emergency buffer (vm.swappiness=1), not capacity: swap in real use
  # means the host is over its RAM budget and an emulator may page out during an alert.
  # The fix is to take the extra canary emulator off, not to wait.
  SwapInUseAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aea-lab-${Host}-swap-in-use
      AlarmDescription: !Sub Swap over 100 MB for 10 min on ${Host} - over the RAM budget. Stop the last canary emulator added (glan first). Swapped pages stay out after the pressure ends, so this stays in ALARM until `sudo swapoff -a && sudo swapon -a` (with enough MemAvailable to take them back).
      Namespace: AeaLab
      MetricName: SwapUsedMB
      Dimensions: [{ Name: Host, Value: !Ref Host }]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue aea-lab-alert-topic]
      OKActions: [!ImportValue aea-lab-alert-topic]

  # Earlier warning than swap: qemu RSS grows for hours after a boot (QA, 25-sep), so the
  # squeeze shows here first.
  MemLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aea-lab-${Host}-memory-low
      AlarmDescription: !Sub MemAvailable under 1 GB for 15 min on ${Host} - the emulators are outgrowing the host; swap or the OOM killer come next.
      Namespace: AeaLab
      MetricName: MemAvailableMB
      Dimensions: [{ Name: Host, Value: !Ref Host }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 15
      Threshold: 1024
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue aea-lab-alert-topic]
      OKActions: [!ImportValue aea-lab-alert-topic]

  # sensor-health's AEA_LOCATION_AGE, read by the probe. Past ~24 h GMS stops alerting (QA-84).
  # sensor-health itself reboots at > 20 h, so 21 h (20 h + 2 runs + boot and first delivery)
  # means that repair did not happen or did not help, still 3 h before the blind limit. Same
  # threshold as the certifier. A receptor with no line in 20 min also lands here (1e7).
  LocationAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aea-lab-${Host}-location-age
      AlarmDescription: !Sub A receptor on ${Host} has a GMS location older than 21 h (the 20 h reboot did not fix it), or sensor-health has not reported its age for 20 min. Per-receptor ages are in /aea-lab/metrics.
      Namespace: AeaLab
      MetricName: LocationAgeMaxSeconds
      Dimensions: [{ Name: Host, Value: !Ref Host }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 75600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue aea-lab-alert-topic]
      OKActions: [!ImportValue aea-lab-alert-topic]

  # From the journal shipped to /aea-lab/journal, e.g.
  # "2026-09-24T23:29:03+00:00 ip-172-31-38-195 python3[48946]: AEA_NOT_OK quibdo (emulator-5556): reason=..."
  # These count events, so no data just means nothing happened: GatewayUp covers a dead host.
  # Term patterns (both words anywhere in the line), not positional ones: the "python3[48946]:"
  # token holds brackets, which space-delimited patterns treat as field delimiters.
  AeaNotOkFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aea-lab/journal
      # reason=booting follows every planned reboot for 2-3 runs: not a problem.
      FilterPattern: !Sub '"AEA_NOT_OK" "${JournalHostname}" -"reason=booting"'
      MetricTransformations:
        - { MetricNamespace: AeaLab, MetricName: !Sub "AeaNotOk-${Host}", MetricValue: "1" }
  # sensor-health runs every 5 min: 3 AEA_NOT_OK runs inside 15 min is "not OK for ~15 min".
  AeaNotOkAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aea-lab-${Host}-aea-not-ok
      AlarmDescription: !Sub sensor-health on ${Host} logged AEA_NOT_OK 3 times in 15 min. The reason is in /aea-lab/journal.
      Namespace: AeaLab
      MetricName: !Sub AeaNotOk-${Host}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 15
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue aea-lab-alert-topic]
      OKActions: [!ImportValue aea-lab-alert-topic]

  NudgeFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aea-lab/journal
      FilterPattern: !Sub '"NUDGE_FAILED" "${JournalHostname}"'
      MetricTransformations:
        - { MetricNamespace: AeaLab, MetricName: !Sub "NudgeFailed-${Host}", MetricValue: "1" }
  NudgeFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aea-lab-${Host}-nudge-failed
      AlarmDescription: !Sub sensor-health on ${Host} logged NUDGE_FAILED - the location path is likely broken, the 20 h reboot is the fallback. Details in /aea-lab/journal.
      Namespace: AeaLab
      MetricName: !Sub NudgeFailed-${Host}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue aea-lab-alert-topic]
      OKActions: [!ImportValue aea-lab-alert-topic]
