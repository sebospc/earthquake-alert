# Everything the deploy pipeline needs on the AWS side, deployed once by hand with admin
# rights (the pipeline never changes its own permissions):
#   aws cloudformation deploy --region sa-east-1 --stack-name aea-lab-deploy \
#     --template-file infra/deploy/stack.yml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides CreateOidcProvider=true --tags project=aea-lab
# Then attach the instance profile to each receptor host (EC2 > Modify IAM role).
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Description: false if the account already has token.actions.githubusercontent.com
  # The repo uses GitHub's immutable subject (owner and repo ids), so a renamed or re-created
  # repo with the same name can never assume the role. Read it with:
  #   gh api repos/sebospc/earthquake-alert/actions/oidc/customization/sub  -> sub_claim_prefix
  OidcSubjectPrefix:
    Type: String
    Default: repo:sebospc@20503334/earthquake-alert@1386205814
Conditions:
  NewOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: NewOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Build artifacts on their way to the host, and the host's hourly backups under gateway-state/.
  # The host fetches artifacts over short presigned URLs. The 30-day expiry is also the backup
  # retention.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aea-lab-deploy-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      LifecycleConfiguration:
        Rules: [{ Id: expire, Status: Enabled, ExpirationInDays: 30 }]

  # Only this repo, only main, only the protected `production` environment. The default OIDC
  # subject of an environment job has no ref, so the repo's template must add it:
  #   echo '{"use_default":false,"use_immutable_subject":true,"include_claim_keys":["repo","context","ref"]}' |
  #     gh api -X PUT repos/sebospc/earthquake-alert/actions/oidc/customization/sub --input -
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aea-lab-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${OidcSubjectPrefix}:environment:production:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals: { aws:ResourceTag/project: aea-lab }
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

  # On the receptor host: SSM Run Command, the CloudWatch agent, and writing its hourly state
  # backup (infra/backup). Write only: the host cannot read a backup back or list the bucket.
  ReceptorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aea-lab-receptor
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: gateway-state-backup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/gateway-state/*
  ReceptorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: aea-lab-receptor
      Roles: [!Ref ReceptorRole]

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
